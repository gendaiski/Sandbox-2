name: agent-graph-original
services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MINIO_ENDPOINT: minio:9000
      AGENT_GRAPH_DIR: /data/app
    ports: ["127.0.0.1:20050:20050"]
    volumes: ["app_data:/data/app"]
    depends_on: [mongodb, minio]
    restart: unless-stopped
  mongodb:
    image: mongodb/mongodb-community-server:8.2.1-ubuntu2204-20251113T064937Z
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
  minio:
    image: keta1933/minio:RELEASE.2025-04-22T22-12-26Z
    env_file: .env
    command: server /data
    volumes: ["file_data:/data"]
    restart: unless-stopped
volumes:
  app_data:
  mongo_data:
  file_data:
