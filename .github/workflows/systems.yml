name: systems

# One job per system, each in its own environment, with the checks that need
# network, model downloads or Docker switched on. Results land in the job
# summary and as a per-system `report-<name>` artifact.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      oxr_free_api:
        description: "Also parse the sample PDF on SoMark's free OXR API (uploads it to a third party)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: systems-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  UV_TORCH_BACKEND: cpu        # CPU torch wheels: much smaller than CUDA ones
  RUN_MODEL_DOWNLOADS: "1"     # pdfstract: semantic chunker + embeddings
  OPENFLOW_FULL: "1"           # openflow: orchestration headless E2E
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # live checks skip when unset

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: chunknorris, system: chunknorris, setup: "" }
          - { label: chunckerflow (full), system: chunckerflow, setup: "--full" }
          - { label: pdfstract, system: pdfstract, setup: "" }
          - { label: oxr, system: oxr, setup: "" }
          - { label: rag-anything, system: rag-anything, setup: "" }
          - { label: rag-anything (MinerU), system: rag-anything, setup: "--full" }
          - { label: openflow, system: openflow, setup: "" }
          - { label: prism-ui, system: prism-ui, setup: "" }
          - { label: langfuse (self-hosted), system: langfuse, setup: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch, MinerU and Docker images are large)
        if: contains(fromJSON('["pdfstract","rag-anything","chunckerflow","langfuse"]'), matrix.system)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        if: matrix.system == 'prism-ui'
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        if: matrix.system == 'prism-ui'
        with: { version: 10 }
      - name: System packages for OpenFlow
        if: matrix.system == 'openflow'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config

      - name: Clone upstream
        if: matrix.system != 'prism-ui'
        run: scripts/clone_all.sh ${{ matrix.system }}

      - name: Set up ${{ matrix.label }}
        run: systems/${{ matrix.system }}/setup.sh ${{ matrix.setup }}

      - name: Test ${{ matrix.label }}
        env:
          OXR_BASE_URL: ${{ (matrix.system == 'oxr' && inputs.oxr_free_api) && 'https://free-oxr.somark.ai/api/v1' || '' }}
          LANGFUSE_WAIT: "180"
        run: ./run.sh ${{ matrix.system }} -v

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/report_summary.py "systems/${{ matrix.system }}/reports" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Langfuse logs on failure
        if: failure() && matrix.system == 'langfuse'
        run: >-
          docker compose -p langfuse-harness --env-file systems/langfuse/langfuse.env
          -f vendor/langfuse/docker-compose.yml logs --tail 200 langfuse-web langfuse-worker || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.system }}${{ matrix.setup && '-full' || '' }}
          path: systems/${{ matrix.system }}/reports/latest.json
          if-no-files-found: ignore

  bench:
    # Collects every job's report into bench/ on this branch, for the
    # Systems Test Bench dashboard. [skip ci] keeps the commit from re-running CI.
    name: bench data
    needs: test
    if: always() && github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: bench-reports
      - name: Link each row to its CI job
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=50"
          --jq '[.jobs[] | {(.name): .html_url}] | add' > jobs.json
      - name: Build bench data
        run: |
          python3 scripts/build_bench_data.py bench-reports jobs.json bench
          echo '{"run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "sha": "${{ github.sha }}"}' > bench/run.json
          python3 scripts/build_bench_page.py bench
          python3 scripts/build_system_pages.py bench
      - name: Commit bench data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench
          git diff --cached --quiet && exit 0
          git commit -m "Update bench data from CI run ${{ github.run_number }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
