name: systems

# One job per system, each in its own environment, with the checks that need
# network, model downloads or Docker switched on. Results land in the job
# summary and as a per-system `report-<name>` artifact.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      oxr_free_api:
        description: "Also parse the sample PDF on SoMark's free OXR API (uploads it to a third party)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: systems-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  UV_TORCH_BACKEND: cpu        # CPU torch wheels: much smaller than CUDA ones
  RUN_MODEL_DOWNLOADS: "1"     # pdfstract: semantic chunker + embeddings
  OPENFLOW_FULL: "1"           # openflow: orchestration headless E2E
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # live checks skip when unset
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 75 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: chunknorris, system: chunknorris, setup: "" }
          - { label: chunckerflow (full), system: chunckerflow, setup: "--full" }
          - { label: pdfstract, system: pdfstract, setup: "" }
          - { label: oxr, system: oxr, setup: "" }
          - { label: rag-anything, system: rag-anything, setup: "" }
          - { label: rag-anything (MinerU), system: rag-anything, setup: "--full" }
          - { label: openflow, system: openflow, setup: "" }
          - { label: prism-ui, system: prism-ui, setup: "" }
          - { label: langfuse (self-hosted), system: langfuse, setup: "" }
          - { label: chunking-methods, system: chunking-methods, setup: "" }
          - { label: chunky, system: chunky, setup: "" }
          - { label: pake (real build), system: pake, setup: "" }
          - { label: flowise, system: flowise, setup: "" }
          # Installed with their original apps; each test drives the real UI in a browser.
          - { label: lobehub (full stack), system: lobehub, setup: "", ui: true }
          - { label: autogpt (platform), system: autogpt, setup: "", ui: true }
          - { label: continue (VS Code extension), system: continue, setup: "", ui: true, timeout: 120 }
          - { label: camel (all extras), system: camel, setup: "", ui: true }
          - { label: metagpt (all extras), system: metagpt, setup: "", ui: true }
          - { label: dspy, system: dspy, setup: "", ui: true }
          - { label: izwi (speech round trip), system: izwi, setup: "--no-models", ui: true, timeout: 150 }
          - { label: skills-manager (desktop app), system: skills-manager, setup: "", ui: true, timeout: 90 }
          - { label: loopcut (Blender fork), system: loopcut, setup: "", ui: true, timeout: 340 }
          - { label: fabricjs, system: fabricjs, setup: "", ui: true }
          - { label: fabricjs-site, system: fabricjs-site, setup: "", ui: true }
          - { label: gods-eye-view, system: gods-eye-view, setup: "", ui: true }
          - { label: claude-code-best-practice, system: claude-code-best-practice, setup: "", ui: true }
          - { label: opus-videos, system: opus-videos, setup: "", ui: true }
          - { label: appwrite (self-hosted), system: appwrite, setup: "", ui: true, timeout: 90 }
          - { label: pocketbase, system: pocketbase, setup: "", ui: true }
          - { label: post-studio (post grabber), system: post-studio, setup: "", ui: true, timeout: 30 }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch, MinerU and Docker images are large)
        if: contains(fromJSON('["pdfstract","rag-anything","chunckerflow","langfuse","chunky","pake","flowise","lobehub","autogpt","continue","camel","metagpt","dspy","izwi","skills-manager","loopcut","appwrite"]'), matrix.system)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: More disk for the Blender build (libraries and build tree are ~25 GB)
        if: matrix.system == 'loopcut'
        run: >-
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy && docker system prune -af && df -h /

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        if: contains(fromJSON('["prism-ui","pake","flowise"]'), matrix.system) || matrix.ui
        with: { node-version: "${{ contains(fromJSON('[\"flowise\",\"gods-eye-view\"]'), matrix.system) && '24' || '22' }}" }
      - uses: pnpm/action-setup@v4
        if: contains(fromJSON('["prism-ui","pake","fabricjs"]'), matrix.system)
        with: { version: 10 }
      - uses: ruby/setup-ruby@v1
        if: matrix.system == 'fabricjs-site'
        with: { ruby-version: "3.3" }
      - name: Browser for the UI checks
        if: matrix.ui
        timeout-minutes: 35
        # A stalled apt or browser download once held this step until the job's own timeout (run 40, lobehub):
        # each attempt gets 10 minutes, then a retry.
        run: |
          npm install -g playwright@1.56.1
          for attempt in 1 2 3; do
            timeout 600 npx -y playwright@1.56.1 install --with-deps chromium && exit 0
            echo "browser install attempt $attempt failed or stalled"; sleep 15
          done
          exit 1
      - name: Desktop apps' display, screenshots and speech
        if: contains(fromJSON('["skills-manager","loopcut","izwi"]'), matrix.system)
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick espeak-ng mesa-utils libgl1-mesa-dri
      - name: System packages for OpenFlow
        if: matrix.system == 'openflow'
        run: sudo apt-get update -q && sudo apt-get install -y -q libdbus-1-dev pkg-config
      - name: Tauri libraries for Pake's app build
        if: contains(fromJSON('["pake","skills-manager","izwi"]'), matrix.system)
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config

      - name: Clone upstream
        if: matrix.system != 'prism-ui' && matrix.system != 'post-studio'
        run: scripts/clone_all.sh ${{ matrix.system }}

      - name: Set up ${{ matrix.label }}
        run: systems/${{ matrix.system }}/setup.sh ${{ matrix.setup }} && touch systems/${{ matrix.system }}/.ready

      - name: Test ${{ matrix.label }}
        env:
          OXR_BASE_URL: ${{ (matrix.system == 'oxr' && inputs.oxr_free_api) && 'https://free-oxr.somark.ai/api/v1' || '' }}
          LANGFUSE_WAIT: "180"
          PAKE_REAL_BUILD: "1"
        run: ./run.sh ${{ matrix.system }} -v

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/report_summary.py "systems/${{ matrix.system }}/reports" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Langfuse logs on failure
        if: failure() && matrix.system == 'langfuse'
        run: >-
          docker compose -p langfuse-harness --env-file systems/langfuse/langfuse.env
          -f vendor/langfuse/docker-compose.yml logs --tail 200 langfuse-web langfuse-worker || true

      - name: Flowise logs on failure
        if: failure() && matrix.system == 'flowise'
        run: docker logs --tail 200 flowise-harness || true

      - uses: actions/upload-artifact@v4
        if: always()
        # The report is a by-product: a storage timeout must not fail a job whose tests passed.
        continue-on-error: true
        with:
          name: report-${{ matrix.system }}${{ (matrix.setup == '--full') && '-full' || '' }}
          path: |
            systems/${{ matrix.system }}/reports/latest.json
            systems/${{ matrix.system }}/reports/shots/
          if-no-files-found: ignore

  bench:
    # Collects every job's report into bench/ on this branch, for the
    # Systems Test Bench dashboard. [skip ci] keeps the commit from re-running CI.
    name: bench data
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: bench-reports
      - name: Link each row to its CI job
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=50"
          --jq '[.jobs[] | {(.name): .html_url}] | add' > jobs.json
      - name: Build bench data
        run: |
          python3 scripts/build_bench_data.py bench-reports jobs.json bench
          echo '{"run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "sha": "${{ github.sha }}"}' > bench/run.json
          python3 scripts/build_bench_page.py bench
          python3 scripts/build_system_pages.py bench
      - name: Commit bench data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench
          git diff --cached --quiet && exit 0
          git commit -m "Update bench data from CI run ${{ github.run_number }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
