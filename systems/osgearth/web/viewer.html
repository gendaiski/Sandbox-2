<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original osgEarth ImGui viewer</title><style>html,body{margin:0;width:100%;height:100%;background:#161d24;color:#d6e3eb;font:13px system-ui}#screen{height:calc(100% - 36px)}header{height:36px;box-sizing:border-box;padding:7px 12px;display:flex;justify-content:space-between;background:#202c35}button{border:0;background:#354957;color:white;border-radius:4px;cursor:pointer}a{color:#b9d9dc}#state{margin-left:15px;font-size:11px;color:#b3c4d0}</style><header><span>osgEarth · Original native interface<span id="state">Connecting…</span></span><button id="fullscreen">Fullscreen</button></header><div id="screen"></div><script type="module">import RFB from './novnc/core/rfb.js';const protocol=location.protocol==='https:'?'wss:':'ws:';const rfb=new RFB(document.querySelector('#screen'),protocol+'//'+location.host+'/websockify');rfb.scaleViewport=true;rfb.resizeSession=false;rfb.background='#131a21';rfb.addEventListener('connect',()=>document.querySelector('#state').textContent='Connected · drag to orbit, scroll to zoom');rfb.addEventListener('disconnect',()=>document.querySelector('#state').textContent='Session disconnected — reload to reconnect');document.querySelector('#fullscreen').onclick=async()=>{try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.querySelector('#state').textContent='Use the full-window browser view on this device.'}catch{document.querySelector('#state').textContent='Fullscreen is unavailable in this browser.'}};window.__rfb=rfb;</script></html>
