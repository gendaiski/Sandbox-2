function boundAgreementHTML(r){const text=r.agreement,items=[],v=r.variables||{};function add(a,b,key){if(a>=0&&b>a)items.push({a,b,key})}for(const key of ['customer','supplier','buyer','target']){const value=v[key];if(typeof value==='string'&&value.length>=2){let at=0;while((at=text.indexOf(value,at))>=0){add(at,at+value.length,key);at+=value.length}}}const specs=[['annual_fee',/(Annual fee:\s*[^\d\n]*)([\d,.]+)/gi],['payment_days',/(Payment:\s*)(\d+)( days)/gi],['payment_days',/(invoices are payable within\s+)(\d+)( days)/gi],['term_months',/(Term:\s*)(\d+)( months)/gi],['term_months',/(initial term is\s+)(\d+)( months)/gi],['personal_data',/(Personal data processing:\s*)(Included|Excluded)/gi],['transaction_value',/(transaction value:\s*[^\d\n]*)([\d,.]+)/gi],['review_days',/(Review period:\s*)(\d+)( business days)/gi]];for(const[key,regex]of specs)for(const m of text.matchAll(regex)){if(v[key]!==undefined)add(m.index+m[1].length,m.index+m[1].length+m[2].length,key)}if(Array.isArray(v.milestones))for(const stage of v.milestones){if(!stage||typeof stage.name!=='string')continue;const escaped=stage.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const regex=new RegExp('(• '+escaped+': [^\\d\\n]*)([\\d,.]+)','g');for(const m of text.matchAll(regex))add(m.index+m[1].length,m.index+m[1].length+m[2].length,'annual_fee')}items.sort((a,b)=>a.a-b.a||b.b-a.b);let html='',last=0;const unique=new Set();for(const item of items){if(item.a<last)continue;html+=esc(text.slice(last,item.a));const fresh=(r.changedFields||[]).includes(item.key);html+=`<button class="doc-binding ${fresh?'field-updated':''}" data-doc-field="${item.key}" title="Edit ${item.key} in Python">${esc(text.slice(item.a,item.b))}</button>`;unique.add(item.key);last=item.b}html+=esc(text.slice(last));return {html,count:unique.size}}
