services:
  legal-rag:
    build: .
    ports:
      - "7860:7860"
    environment:
      LEGALRAG_LANGUAGE: en
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - legal-rag-runtime:/runtime
    restart: unless-stopped
volumes:
  legal-rag-runtime:
